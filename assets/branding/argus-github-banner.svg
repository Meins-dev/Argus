<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Argus — IA que entende e entra em ação</title>
  <desc id="description">Banner de apresentação do Argus, assistente de IA para desktop, com um olho geométrico verde-lima.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101712" />
      <stop offset=".52" stop-color="#0B0D10" />
      <stop offset="1" stop-color="#101514" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#D5F34A" stop-opacity=".21" />
      <stop offset="1" stop-color="#D5F34A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9FF87" />
      <stop offset="1" stop-color="#A8CF18" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#D5F34A" stroke-opacity=".035" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#surface)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <circle cx="964" cy="320" r="370" fill="url(#halo)" />
  <path d="M0 585H1280" stroke="#D5F34A" stroke-opacity=".14" />
  <path d="M96 92h38" stroke="#D5F34A" stroke-width="3" />
  <text x="150" y="99" fill="#D5F34A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5">ARGUS</text>
  <text x="96" y="245" fill="#F2F4EC" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">IA que entende.</text>
  <text x="96" y="315" fill="#D5F34A" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">E entra em ação.</text>
  <text x="98" y="379" fill="#BBC4B9" font-family="DejaVu Sans, Arial, sans-serif" font-size="21">Voz, visão, pesquisa e criação em uma</text>
  <text x="98" y="411" fill="#BBC4B9" font-family="DejaVu Sans, Arial, sans-serif" font-size="21">experiência de IA para desktop.</text>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
    <rect x="96" y="462" width="184" height="38" rx="19" fill="#D5F34A" fill-opacity=".08" stroke="#D5F34A" stroke-opacity=".36" />
    <text x="118" y="486" fill="#E4F38A">VOZ • GEMINI LIVE</text>
    <rect x="294" y="462" width="181" height="38" rx="19" fill="#D5F34A" fill-opacity=".08" stroke="#D5F34A" stroke-opacity=".36" />
    <text x="317" y="486" fill="#E4F38A">FERRAMENTAS LOCAIS</text>
    <rect x="489" y="462" width="205" height="38" rx="19" fill="#D5F34A" fill-opacity=".08" stroke="#D5F34A" stroke-opacity=".36" />
    <text x="512" y="486" fill="#E4F38A">ESTÚDIO DE SLIDES</text>
  </g>
  <text x="96" y="555" fill="#778276" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" letter-spacing="2">ASSISTENTE PESSOAL • DESKTOP • CÓDIGO ABERTO</text>
  <g transform="translate(738 64)">
    <circle cx="256" cy="256" r="224" fill="none" stroke="#D5F34A" stroke-opacity=".12" stroke-width="1" />
    <circle cx="256" cy="256" r="202" fill="url(#halo)" />
    <circle cx="256" cy="256" r="184" fill="none" stroke="#243027" stroke-width="2" />
    <circle cx="256" cy="256" r="164" fill="none" stroke="#D5F34A" stroke-opacity=".17" stroke-width="1.5" />
    <path d="M76 256c49-86 111-132 180-132s131 46 180 132c-49 86-111 132-180 132S125 342 76 256Z" fill="#101914" stroke="#D5F34A" stroke-width="10" stroke-linejoin="round" />
    <path d="M111 256c39-58 88-88 145-88s106 30 145 88c-39 58-88 88-145 88s-106-30-145-88Z" fill="none" stroke="#D5F34A" stroke-opacity=".36" stroke-width="2" />
    <circle cx="256" cy="256" r="76" fill="#121B14" stroke="#D5F34A" stroke-width="5" />
    <circle cx="256" cy="256" r="57" fill="url(#iris)" />
    <circle cx="256" cy="256" r="28" fill="#0B0D10" />
    <path d="M94 256h324" stroke="#D5F34A" stroke-opacity=".28" stroke-width="2" stroke-dasharray="4 15" />
    <circle cx="256" cy="71" r="5" fill="#D5F34A" />
    <circle cx="256" cy="441" r="5" fill="#D5F34A" />
  </g>
</svg>
